name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: composer check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `composer check` ends with the backwards compatibility check, which
          # diffs HEAD against the last SemVer tag. The default shallow clone
          # fetches no tags, so it would have no baseline to compare against.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, curl
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.3-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run checks
        run: composer check

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      # Report every failing combination, not just the first one.
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: [12, 13]
        # testbench pins laravel/framework, which `replace`s the illuminate/*
        # packages this package actually requires.
        include:
          - laravel: 12
            testbench: '^10.0'
          - laravel: 13
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, curl
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-L${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-L${{ matrix.laravel }}-

      - name: Pin Laravel ${{ matrix.laravel }}
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Show resolved versions
        # `composer show` takes at most one package argument, so filter the
        # full installed list instead. Never fail the job on a diagnostic.
        run: |
          composer show | grep -E '^(laravel/framework|orchestra/testbench|pestphp/pest|symfony/psr-http-message-bridge)\s' || true

      - name: Run tests
        run: composer test
